set -s @common-window-fmt ''
set -sa @common-window-fmt '#{?#{n:window_name},#{E:@window-type-emoji} #{window_name} | ,}'
set -sa @common-window-fmt '#{pane_title} | #{pane_current_command}'


set -s @tree-session-fmt ''
set -sa @tree-session-fmt '#{session_windows} windows'
set -sa @tree-session-fmt '#{?session_grouped, | group #{session_group},}'
set -sa @tree-session-fmt '#{?session_attached, | #{session_attached} clients,}'

set -s @tree-window-fmt ''
set -sa @tree-window-fmt '#{E:@common-window-fmt}'
set -sa @tree-window-fmt '#{?#{==:#{window_panes},1},, | #{window_panes} panes}'

set -s @tree-pane-fmt '#{pane_title} | #{pane_current_command}'

set -s @tree-fmt '#{?pane_format,#{E:@tree-pane-fmt},window_format,#{E:@tree-window-fmt},#{E:@tree-session-fmt}}'

bind s choose-tree -sZ -F '#{E:@tree-fmt}' -O name
bind w choose-tree -wZ -F '#{E:@tree-fmt}' -O name


set -g set-titles on

set -s @title-session-fmt '#{session_name}#{?session_many_attached,+,}:#{session_windows}[#{window_index}]'
set -g set-titles-string '#{E:@title-session-fmt} | #{E:@common-window-fmt}'
