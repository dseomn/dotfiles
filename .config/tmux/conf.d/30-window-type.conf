set -s @window-type '#{?'
set -sa @window-type '#{!:#{n:window_name}},local,'
set -sa @window-type '#{m/r:^podman($| ),#{window_name}},container,'
set -sa @window-type '#{m/r:^ssh($| ),#{window_name}},remote,'
set -sa @window-type 'invalid}'

set -s @window-type-emoji '#{?'
set -sa @window-type-emoji '#{==:#{E:@window-type},container},🦭,'
set -sa @window-type-emoji '#{==:#{E:@window-type},local},,'
set -sa @window-type-emoji '#{==:#{E:@window-type},remote},🛂,'
set -sa @window-type-emoji '❓}'
