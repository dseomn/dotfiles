- dir: org
  children:
  - dir: gnome
    children:
    - dir: shell
      reset: true
      children:
      - key: command-history
        reset: false
      - key: enabled-extensions
        # TODO(https://bugs.debian.org/cgi-bin/bugreport.cgi?bug=1086595):
        # Switch back to a better system-monitor with graphs.
        value: >-
          ['caffeine@patapon.info',
          'dash-to-panel@jderose9.github.com',
          'no-overview@fthx',
          'system-monitor@gnome-shell-extensions.gcampax.github.com',
          'ubuntu-appindicators@ubuntu.com',
          'wsmatrix@martin.zurowietz.de']
      - key: favorite-apps
        value: >-
          ['org.gnome.Terminal.desktop',
          'firefox.desktop',
          'thunderbird.desktop',
          'pidgin.desktop',
          'io.github.quodlibet.QuodLibet.desktop',
          'org.musicbrainz.Picard.desktop',
          'io.github.quodlibet.ExFalso.desktop',
          'org.gnome.gThumb.desktop',
          'org.gnome.Nautilus.desktop']
      - key: had-bluetooth-devices-setup
        reset: false
      - dir: app-switcher
        children:
        - key: current-workspace-only
          value: "true"
      - dir: extensions
        children:
        - dir: caffeine
          children:
          - key: countdown-timer
            reset: false
          - key: enable-fullscreen
            value: "false"
          - key: restore-state
            value: "true"
          - key: show-notifications
            value: "false"
          - key: toggle-state
            reset: false
          - key: user-enabled
            reset: false
        - dir: dash-to-panel
          children:
          - key: appicon-margin
            value: "4"
          - key: appicon-padding
            value: "2"
          - key: click-action
            value: "'CYCLE'"
          - key: dot-style-focused
            value: "'SEGMENTED'"
          - key: dot-style-unfocused
            value: "'SEGMENTED'"
          - key: multi-monitors
            value: "false"
          - key: panel-element-positions
            value: "'\
              {
                \"0\":[\
                  {\
                    \"element\":\"showAppsButton\",\
                    \"visible\":true,\
                    \"position\":\"stackedTL\"\
                  },\
                  {\
                    \"element\":\"activitiesButton\",\
                    \"visible\":false,\
                    \"position\":\"stackedTL\"\
                  },\
                  {\
                    \"element\":\"leftBox\",\
                    \"visible\":true,\
                    \"position\":\"stackedTL\"\
                  },\
                  {\
                    \"element\":\"taskbar\",\
                    \"visible\":true,\
                    \"position\":\"stackedTL\"\
                  },\
                  {\
                    \"element\":\"centerBox\",\
                    \"visible\":true,\
                    \"position\":\"centerMonitor\"\
                  },\
                  {\
                    \"element\":\"dateMenu\",\
                    \"visible\":true,\
                    \"position\":\"centerMonitor\"\
                  },\
                  {\
                    \"element\":\"rightBox\",\
                    \"visible\":true,\
                    \"position\":\"stackedBR\"\
                  },\
                  {\
                    \"element\":\"systemMenu\",\
                    \"visible\":true,\
                    \"position\":\"stackedBR\"\
                  },\
                  {\
                    \"element\":\"desktopButton\",\
                    \"visible\":false,\
                    \"position\":\"stackedBR\"\
                  }\
                ]\
              }'"
          - key: panel-position
            value: "'TOP'"
          - key: panel-size
            value: "28"
          - key: scroll-panel-action
            value: "'NOTHING'"
          - key: show-window-previews
            value: "false"
        - dir: wsmatrix
          children:
          - key: multi-monitor
            value: "true"
          - key: num-columns
            value: "4"
          - key: num-rows
            value: "3"
          - key: popup-timeout
            value: "0"
          - key: show-workspace-names
            value: "false"
      - dir: keybindings
        children:
        - key: screenshot
          value: "@as []"
        - key: screenshot-window
          value: "@as []"
      - dir: weather
        children:
        - key: locations
          reset: false
