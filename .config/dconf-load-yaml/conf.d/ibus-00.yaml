- dir: desktop
  children:
  - dir: ibus
    reset: true
    children:
    - dir: general
      children:
      - key: version
        reset: false
      - key: use-system-keyboard-layout
        value: "true"
      - key: enable-by-default
        value: "true"
      - key: engines-order
        value: "['typing-booster', 'xkb:us::eng']"
      - key: preload-engines
        value: "['typing-booster', 'xkb:us::eng']"
- dir: org
  children:
  - dir: freedesktop
    children:
    - dir: ibus
      reset: true
      children:
      - dir: engine
        children:
        - dir: typing-booster
          children:
          # See section "Simulate the behaviour of ibus-m17n" of
          # https://mike-fabian.github.io/ibus-typing-booster/docs/user/ for how
          # enable_lookup and tabenable work to minimize use of the pre-edit.
          - key: addspaceoncommit
            value: "false"
          - # See https://github.com/mike-fabian/ibus-typing-booster/issues/580
            # for why prefercommit is set here.
            key: autosettings
            value: >-
              [
              ['prefercommit', 'false', '^SDL2_Application:']
              ]
          - key: candidatesdelaymilliseconds
            value: "@u 0"
          - key: dictionary
            value: "'None'"
          - key: emojipredictions
            value: "true"
          - key: inputmethod
            value: "'t-rfc1345-plus'"
          - key: keybindings
            value: >-
              {
              'commit': <['Return']>,
              'commit_and_forward_key': <['Left']>,
              'enable_lookup': <@as []>,
              'toggle_off_the_record': <@as []>
              }
          - key: offtherecord
            value: "true"
          - key: pagesize
            value: "9"
          - key: recordmode
            value: "3"  # nothing
          - key: shownumberofcandidates
            value: "true"
          - key: tabenable
            value: "true"
