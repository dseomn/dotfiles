<?xml version="1.0" ?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!--
    Generally prefer Noto fonts to get consistency across scripts.
    https://fonts.google.com/noto/use has details about the specific fonts. To
    compare this file against installed Noto fonts:

    diff -u \
      <(grep '^      <family>' ~/.config/fontconfig/conf.d/50-defaults.conf | sort -u) \
      <(fc-list -f '%{family[0]}\n' | grep '^Noto ' | sed 's!.*!      <family>\0</family>!' | sort -u)
  -->

  <!--
    Within Noto, a CJK (generally fullwidth) font with a matching language gets
    preference over a symbols-like font without a matching language. This sets
    the languages I usually use to the symbols-like fonts to fix that.
  -->
  <match target="scan">
    <test name="family">
      <string>Noto Music</string>
    </test>
    <edit name="lang">
      <langset>
        <string>en</string>
      </langset>
    </edit>
  </match>
  <match target="scan">
    <test name="family">
      <string>Noto Sans Math</string>
    </test>
    <edit name="lang">
      <langset>
        <string>en</string>
      </langset>
    </edit>
  </match>
  <match target="scan">
    <test name="family">
      <string>Noto Sans Symbols</string>
    </test>
    <edit name="lang">
      <langset>
        <string>en</string>
      </langset>
    </edit>
  </match>
  <match target="scan">
    <test name="family">
      <string>Noto Sans Symbols2</string>
    </test>
    <edit name="lang">
      <langset>
        <string>en</string>
      </langset>
    </edit>
  </match>

  <!--
    Between Noto and other fonts, another font that covers multiple languages
    can get preference for a character in one of its languages over a Noto font.
    E.g., for an Arabic character in English text, a non-Noto font that covers
    both Arabic and English would be preferred over a Noto font, because the
    Noto fonts that have Arabic characters don't match the language English, but
    the other font matches English and has the character. This prevents language
    from getting precendence over family for non-Noto fonts.
  -->
  <match target="scan">
    <test name="family" compare="not_contains">
      <string>Noto</string>
    </test>
    <edit name="lang">
      <langset>
        <string>x-none</string>
      </langset>
    </edit>
  </match>

  <!--
    The mono fonts are organized differently, which can cause language matches
    to prefer them over other fonts when a mono font isn't requested. Language
    preference also doesn't seem to be very useful between the mono fonts. This
    prevents the mono fonts from getting language preference over non-mono
    fonts. But since it would also give non-mono fonts language preference over
    mono fonts when mono is requested, the mono fonts are made strong below in
    that case.
  -->
  <match target="scan">
    <test name="family" compare="contains">
      <string>Mono</string>
    </test>
    <edit name="lang">
      <langset>
        <string>x-none</string>
      </langset>
    </edit>
  </match>

  <!--
    Prefer different Noto CJK fonts depending on the lang.

    This should override the order of fonts below for CJK languages. For other
    languages, the lists below put CJK at the end to avoid using fullwidth
    glyphs in generally non-fullwidth languages. E.g., U+2236 RATIO had too much
    space around it without CJK at the bottom.
  -->
  <include>/usr/share/fontconfig/conf.avail/70-fonts-noto-cjk.conf</include>

  <alias>
    <family>emoji</family>
    <prefer>
      <family>preferred-emoji</family>
      <family>preferred-sans-serif</family>
      <family>preferred-system-ui</family>
      <family>preferred-serif</family>
      <family>preferred-monospace</family>
    </prefer>
  </alias>

  <alias>
    <family>monospace</family>
    <prefer>
      <family>preferred-monospace-strong</family>
      <family>preferred-system-ui</family>
      <family>preferred-sans-serif</family>
      <family>preferred-emoji</family>
      <family>preferred-serif</family>
    </prefer>
  </alias>

  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>preferred-sans-serif</family>
      <family>preferred-system-ui</family>
      <family>preferred-emoji</family>
      <family>preferred-serif</family>
      <family>preferred-monospace</family>
    </prefer>
  </alias>

  <alias>
    <family>serif</family>
    <prefer>
      <family>preferred-serif</family>
      <family>preferred-emoji</family>
      <family>preferred-sans-serif</family>
      <family>preferred-system-ui</family>
      <family>preferred-monospace</family>
    </prefer>
  </alias>

  <alias>
    <family>system-ui</family>
    <prefer>
      <family>preferred-system-ui</family>
      <family>preferred-sans-serif</family>
      <family>preferred-emoji</family>
      <family>preferred-serif</family>
      <family>preferred-monospace</family>
    </prefer>
  </alias>

  <alias>
    <family>preferred-emoji</family>
    <prefer>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>

  <!-- See the scan match above for why this does strong binding too. -->
  <alias>
    <family>preferred-monospace</family>
    <prefer>
      <!-- Prefer DejaVu instead of Noto because it's vertically denser. -->
      <family>DejaVu Sans Mono</family>
      <family>Noto Sans Mono</family>
      <family>Noto Mono</family>
      <family>Noto Sans Mono CJK HK</family>
      <family>Noto Sans Mono CJK JP</family>
      <family>Noto Sans Mono CJK KR</family>
      <family>Noto Sans Mono CJK SC</family>
      <family>Noto Sans Mono CJK TC</family>
    </prefer>
  </alias>
  <match>
    <test name="family">
      <string>preferred-monospace-strong</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>DejaVu Sans Mono</string>
      <string>Noto Sans Mono</string>
      <string>Noto Mono</string>
      <string>Noto Sans Mono CJK HK</string>
      <string>Noto Sans Mono CJK JP</string>
      <string>Noto Sans Mono CJK KR</string>
      <string>Noto Sans Mono CJK SC</string>
      <string>Noto Sans Mono CJK TC</string>
    </edit>
  </match>

